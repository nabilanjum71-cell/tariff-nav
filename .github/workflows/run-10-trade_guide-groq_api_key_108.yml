name: Sync 10 - trade_guide (GROQ_API_KEY_108)

on:
  schedule:
    - cron: '37 10 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: "trade_guide via GROQ_API_KEY_108"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY_108 }}
        run: node scripts/generate-content-batch.js --section=trade_guide --key=GROQ_API_KEY_108 --batch=500
