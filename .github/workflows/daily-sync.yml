name: Daily Data Sync

on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  sync-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci

      # ── BLOG POST ───────────────────────────────────────────
      - name: Generate blog post
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_KEY_3: ${{ secrets.GROQ_KEY_3 }}
          UNSPLASH_KEY: ${{ secrets.UNSPLASH_KEY }}
        run: node scripts/generate-blog.js

      - run: sleep 15

      # ══════════════════════════════════════════════════════
      # IMPORT GUIDE — 3 keys × 100 = 300/run
      # ══════════════════════════════════════════════════════
      - name: "[KEY4] import_guide"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_KEY_4: ${{ secrets.GROQ_KEY_4 }}
        run: node scripts/generate-content-batch.js --section=import_guide --key=GROQ_KEY_4

      - run: sleep 15

      - name: "[KEY11] import_guide"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY_11: ${{ secrets.GROQ_API_KEY_11 }}
        run: node scripts/generate-content-batch.js --section=import_guide --key=GROQ_API_KEY_11

      - run: sleep 15

      - name: "[KEY12] import_guide"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY_12: ${{ secrets.GROQ_API_KEY_12 }}
        run: node scripts/generate-content-batch.js --section=import_guide --key=GROQ_API_KEY_12

      - run: sleep 15

      # ══════════════════════════════════════════════════════
      # DUTY BREAKDOWN — 3 keys × 100 = 300/run
      # ══════════════════════════════════════════════════════
      - name: "[KEY5] duty_breakdown"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_KEY_5: ${{ secrets.GROQ_KEY_5 }}
        run: node scripts/generate-content-batch.js --section=duty_breakdown --key=GROQ_KEY_5

      - run: sleep 15

      - name: "[KEY14] duty_breakdown"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_KEY_14: ${{ secrets.GROQ_KEY_14 }}
        run: node scripts/generate-content-batch.js --section=duty_breakdown --key=GROQ_KEY_14

      - run: sleep 15

      - name: "[KEY15] duty_breakdown"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_KEY_15: ${{ secrets.GROQ_KEY_15 }}
        run: node scripts/generate-content-batch.js --section=duty_breakdown --key=GROQ_KEY_15

      - run: sleep 15

      # ══════════════════════════════════════════════════════
      # TRADE GUIDE — 1 key × 100 = 100/run
      # ══════════════════════════════════════════════════════
      - name: "[KEY1] trade_guide"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_KEY_1: ${{ secrets.GROQ_KEY_1 }}
        run: node scripts/generate-content-batch.js --section=trade_guide --key=GROQ_KEY_1

      - run: sleep 15

      # ══════════════════════════════════════════════════════
      # IMPORTER FAQ — 1 key × 100 = 100/run
      # ══════════════════════════════════════════════════════
      - name: "[KEY2] importer_faq"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_KEY_2: ${{ secrets.GROQ_KEY_2 }}
        run: node scripts/generate-content-batch.js --section=importer_faq --key=GROQ_KEY_2

