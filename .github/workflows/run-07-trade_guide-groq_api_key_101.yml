name: Sync 07 - duty_breakdown (GROQ_API_KEY_101)

on:
  schedule:
    - cron: '51 7 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: "duty_breakdown via GROQ_API_KEY_101"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY_101 }}
        run: node scripts/generate-content-batch.js --section=duty_breakdown --key=GROQ_API_KEY_101 --batch=500
