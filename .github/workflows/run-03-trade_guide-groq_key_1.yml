name: Sync 03 - trade_guide (GROQ_KEY_1)

on:
  schedule:
    - cron: '30 8 * * *'
    - cron: '30 20 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: "trade_guide via GROQ_KEY_1"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_KEY_1 }}
        run: node scripts/generate-content-batch.js --section=trade_guide --key=GROQ_KEY_1
