name: Daily Data Sync

on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  content-gen:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - section: import_guide
            key: GROQ_KEY_4
          - section: import_guide
            key: GROQ_API_KEY_11
          - section: import_guide
            key: GROQ_API_KEY_12
          - section: duty_breakdown
            key: GROQ_KEY_5
          - section: duty_breakdown
            key: GROQ_KEY_14
          - section: duty_breakdown
            key: GROQ_KEY_15
          - section: trade_guide
            key: GROQ_KEY_1
          - section: trade_guide
            key: GROQ_API_KEY_101
          - section: importer_faq
            key: GROQ_KEY_2
          - section: importer_faq
            key: GROQ_API_KEY_102
          - section: importer_faq
            key: GROQ_API_KEY_103
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: "${{ matrix.section }} via ${{ matrix.key }}"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets[matrix.key] }}
        run: node scripts/generate-content-batch.js --section=${{ matrix.section }} --key=${{ matrix.key }}
