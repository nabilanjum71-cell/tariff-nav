name: Sync 11 - importer_faq (GROQ_API_KEY_109)

on:
  schedule:
    - cron: '36 11 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: "importer_faq via GROQ_API_KEY_109"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY_109 }}
        run: node scripts/generate-content-batch.js --section=importer_faq --key=GROQ_API_KEY_109 --batch=500
