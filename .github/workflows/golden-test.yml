name: Golden Key Test

on:
  workflow_dispatch:

jobs:
  import_guide_golden_test:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: "import_guide via GROQ_API_KEY_GOLDEN"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY_GOLDEN }}
        run: node scripts/generate-content-batch.js --section=import_guide --key=GROQ_API_KEY_GOLDEN
