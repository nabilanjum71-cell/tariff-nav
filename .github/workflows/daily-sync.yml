          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_KEY_5 }}
        run: node scripts/generate-content-batch.js --section=duty_breakdown --key=GROQ_KEY_5
      - name: "duty_breakdown via GROQ_KEY_14"
